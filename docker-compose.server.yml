# Ezt a fájlt másold a szerverre docker-compose.yml néven (a forráskód nem kell hozzá).
services:
  halloween:
    image: ghcr.io/FELHASZNALO/halloween-app:latest   # a GitHub felhasználóneved és a repó neve, kisbetűvel
    container_name: halloween
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TEACHER_USER: ${TEACHER_USER:-tanar}
      TEACHER_PASS: ${TEACHER_PASS:?Hozz letre egy .env fajlt TEACHER_PASS=... sorral}
      DURATION_MIN: ${DURATION_MIN:-160}
      MAX_MB: 30
      HELP_COST: ${HELP_COST:-5}
      STUDENT_SESSION_LIMIT: ${STUDENT_SESSION_LIMIT:-1}
      REQUIRE_SHARE: ${REQUIRE_SHARE:-1}
      DATA_KEY: ${DATA_KEY:-}            # a feltöltött .pkt fájlok titkosításához (ne veszítsd el!)
      COOKIE_SECURE: ${COOKIE_SECURE:-}  # 1 = a belépés csak HTTPS-en működik
      # TRUST_PROXY: "1"
      DB_HOST: ${DB_HOST:?Hozz letre egy .env fajlt DB_HOST=... sorral (a NAS LAN IP-je, ne localhost)}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-netlab}
      DB_PASSWORD: ${DB_PASSWORD:?Hozz letre egy .env fajlt DB_PASSWORD=... sorral}
      DB_NAME: ${DB_NAME:-netlab}
    # volumes:
      # - ./media:/app/public/media:ro    # csak akkor, ha a scare.mp4 nincs a repóban/image-ben
