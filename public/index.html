<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A Boszorkányhegyi Hálózat átka</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
<style>

:root{--or:#ff7a1a;--pu:#9b5cff;--tx:#efe6ff;--mut:#a899c4;--card:#1a1228;--red:#ff3b3b;--ok:#5dff9d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,#3d1a60 0%,#0b0713 62%) fixed;color:var(--tx);font-family:'Special Elite',Georgia,serif;line-height:1.55;min-height:100vh}
h1,h2,h3{font-family:'Creepster',Georgia,serif;font-weight:400;letter-spacing:2px;margin:.3em 0}
code{background:#2b1d44;color:#ffb36b;padding:1px 6px;border-radius:5px;font-size:.92em}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 70px}
.hero{text-align:center;padding:60px 10px 30px;position:relative;overflow:hidden}
.moon{width:150px;height:150px;border-radius:50%;margin:0 auto 10px;background:radial-gradient(circle at 35% 35%,#fff7d6,#ffd36b 60%,#e0a53a);box-shadow:0 0 90px 25px rgba(255,200,90,.35)}
.hero h1{font-size:clamp(2.4rem,8vw,4.6rem);color:var(--or);text-shadow:0 0 22px rgba(255,122,26,.65)}
.hero p{max-width:640px;margin:14px auto;color:var(--mut);font-size:1.05rem}
.bat{position:absolute;font-size:28px;animation:fly 14s linear infinite;opacity:.8}
@keyframes fly{from{transform:translateX(-80px) translateY(0)}50%{transform:translateX(50vw) translateY(40px)}to{transform:translateX(110vw) translateY(-10px)}}
.pump{font-size:54px;display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
button{font-family:inherit;cursor:pointer}
.big{background:linear-gradient(180deg,#ff9a3c,#e05a00);color:#1a0a00;border:0;border-radius:14px;padding:16px 40px;font-size:1.5rem;font-family:'Creepster',serif;letter-spacing:2px;box-shadow:0 0 30px rgba(255,122,26,.6);transition:transform .15s}
.big:hover{transform:scale(1.06)}
#bar{position:sticky;top:0;z-index:20;background:rgba(11,7,19,.92);border-bottom:2px solid var(--pu);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(4px)}
#timer{font-family:'Creepster',serif;font-size:2rem;color:var(--or);letter-spacing:3px}
#timer.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.prog{color:var(--mut)}
details{background:var(--card);border:1px solid #3a2a58;border-radius:12px;margin:14px 0;padding:6px 14px}
summary{cursor:pointer;font-family:'Creepster',serif;font-size:1.4rem;color:var(--pu);letter-spacing:2px;padding:6px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem;margin:8px 0}
th,td{border:1px solid #3a2a58;padding:4px 8px;text-align:left;white-space:nowrap}
th{background:#2b1d44;color:var(--or)}
svg text{font-family:'Special Elite',Georgia,serif}
.card{background:var(--card);border:1px solid #3a2a58;border-radius:14px;padding:16px 20px;margin:18px 0}
.card h2{color:var(--or);margin:0 0 4px}
.pts{color:var(--mut);font-size:.9rem}
.card.locked{opacity:.45;text-align:center}
.card.puz{border:2px solid var(--pu);box-shadow:0 0 28px rgba(155,92,255,.35)}
.card ul,.card ol{padding-left:22px}
.card li{margin:6px 0}
input[type=text]{background:#0f0a1a;color:var(--tx);border:2px solid var(--pu);border-radius:10px;padding:10px 14px;font-size:1.1rem;font-family:inherit;width:min(260px,100%)}
.ans{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ans button{background:var(--pu);color:#fff;border:0;border-radius:10px;padding:11px 22px;font-size:1rem}
.ans button:disabled{opacity:.4}
.msg{color:var(--red);min-height:1.4em;margin-top:6px}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#scare,#end{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center}
#scare video{width:100%;height:100%;object-fit:contain;background:#000}
#verr{display:none;position:absolute;max-width:560px;background:#1a1228;border:2px solid var(--red);border-radius:12px;padding:18px;text-align:center}
#verr button{margin-top:10px;background:var(--pu);color:#fff;border:0;border-radius:8px;padding:8px 18px}
#end{flex-direction:column;text-align:center;padding:20px;background:radial-gradient(circle,#4a0000,#000)}
#end h1{font-size:clamp(2.5rem,9vw,5rem);color:var(--red)}
footer{text-align:center;margin-top:40px;color:#5a4a78;font-size:.8rem}
footer a{color:#5a4a78;cursor:pointer;text-decoration:underline}
.ok{color:var(--ok)}

input[type=password],input[type=text]{background:#0f0a1a;color:var(--tx);border:2px solid var(--pu);border-radius:10px;padding:10px 14px;font-size:1.1rem;font-family:inherit;width:min(280px,100%)}
input[type=file]{color:var(--tx);font-family:inherit;max-width:100%}
textarea{width:100%;min-height:90px;background:#0f0a1a;color:var(--tx);border:2px solid var(--pu);border-radius:10px;padding:10px;font-family:monospace}
.sm{background:var(--pu);color:#fff;border:0;border-radius:8px;padding:5px 12px;font-family:inherit}
.sm.red{background:#a01818}
.msg.ok{color:var(--ok)}
a{color:var(--or)}
#who{color:var(--mut);font-size:.9rem;display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<div id="bar" style="display:none"></div>
<div class="wrap" id="app"></div>
<div id="scare"><video id="vid" playsinline preload="auto"></video><div id="verr"></div></div>
<div id="end"><h1>Az átok győzött…</h1><p>Lejárt az idő. A Kastély örökre sötétben maradt.</p><button class="big" id="replay" style="margin-top:20px">Újranézem</button></div>

<script>
/* ===== Beállítások ===== */
const VIDEOS=['/public/media/scare.mp4','/media/scare.mp4','media/scare.mp4','/frontend/public/media/scare.mp4'];
const SOUND_DELAY_MS=1500;           // ennyi ms-ig megy némán a videó, utána jön be a hang
const STORY="Halloween éjjel a <strong>Boszorkányhegy Rt.</strong> hálózatát megátkozta egy kóbor szellem: a jelszavak eltűntek, a VLAN-ok összekeveredtek, a tartalék internet pedig „kísért\". Ti vagytok a <strong>Szellemirtó Hálózatmérnökök</strong>. Hajnalig (a tanóra végéig) helyre kell állítanotok a rendszert, különben a Kastély örökre sötétben marad.";

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ms=>{const s=Math.ceil(Math.max(0,ms)/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(n=>String(n).padStart(2,'0')).join(':')};
const dt=ms=>ms?new Date(ms).toLocaleString('hu-HU'):'–';
const mb=b=>(b/1048576).toFixed(2)+' MB';
const vid=$('#vid'); vid.src=VIDEOS[0];

/* ===== Videó ===== */
let vi=0;
function srcErr(){
  if(vi<VIDEOS.length-1){vi++;vid.src=VIDEOS[vi];vid.load();const p=vid.play();if(p&&p.catch)p.catch(()=>{});return}
  diag();
}
async function diag(done){
  failShow('Vizsgálom a videó elérését…',done);
  let r='';
  for(const u of VIDEOS){try{const x=await fetch(u,{method:'HEAD'});r+='<tr><td><code>'+u+'</code></td><td>'+x.status+'</td><td>'+(x.headers.get('content-type')||'?')+'</td><td>'+(x.headers.get('content-length')||'?')+'</td></tr>'}catch(e){r+='<tr><td><code>'+u+'</code></td><td colspan=3>hiba</td></tr>'}}
  failShow('<b>A videó nem játszható le.</b><table style="margin:10px auto;font-size:.8rem"><tr><th>Útvonal</th><th>Státusz</th><th>Típus</th><th>Méret</th></tr>'+r+'</table><div style="font-size:.85rem;text-align:left">• <b>Típus text/html</b> vagy <b>404</b>: rossz az útvonal (a szerver az index.html-t adja vissza).<br>• <b>Típus video/mp4</b>, de mégsem játszik: nem H.264/AAC a kódolás, vagy sérült a fájl.</div>',done);
}
function failShow(msg,done){
  const e=$('#verr'); e.innerHTML=msg+'<br><button id="vclose">Bezár</button>'; e.style.display='block';
  $('#vclose').onclick=()=>{$('#scare').style.display='none';e.style.display='none';if(done)done()};
}
function unmuteLater(){
  setTimeout(()=>{
    vid.muted=false; let v=0;
    const iv=setInterval(()=>{v=Math.min(1,v+0.15);vid.volume=v;if(v>=1)clearInterval(iv)},50);
    setTimeout(()=>{if(vid.paused&&!vid.ended){vid.muted=true;vid.play().catch(()=>{})}},400); // ha a böngésző megállítaná, némán megy tovább
  },SOUND_DELAY_MS);
}
function playScare(final,done){
  const box=$('#scare'); $('#verr').style.display='none'; box.style.display='flex';
  try{vid.currentTime=0}catch(e){}
  const finish=()=>{box.style.display='none'; vid.onended=null; if(final) showEnd(); else if(done) done();};
  vid.onended=finish; vid.onerror=srcErr; vid.muted=true; vid.volume=0;
  vid.removeEventListener('playing',unmuteLater); vid.addEventListener('playing',unmuteLater,{once:true});
  const p=vid.play();
  if(p&&p.catch) p.catch(e=>{
    if(e&&e.name==='NotAllowedError'){vid.muted=true;const q=vid.play();if(q&&q.catch)q.catch(()=>failShow('A böngésző letiltotta a lejátszást.',()=>{if(final)showEnd();else if(done)done()}))}
    else if(e&&e.name==='NotSupportedError') diag(()=>{if(final)showEnd();else if(done)done()});
    else if(e&&e.name!=='AbortError') failShow('Lejátszási hiba: '+(e.message||e.name),()=>{if(final)showEnd();else if(done)done()});
  });
}
function showEnd(){$('#end').style.display='flex'}
$('#replay').onclick=()=>{$('#end').style.display='none';playScare(true)};


/* ===== Térkép (SVG) ===== */
function mapSvg(){
  const n={ISPF:[170,40,'ISP-FO','r'],ISPT:[470,40,'ISP-TARTALEK','r'],R1:[170,150,'R-KASTELY1','r'],R2:[470,150,'R-KASTELY2','r'],
  SD1:[170,260,'SW-D1','s'],SD2:[470,260,'SW-D2','s'],SA1:[170,370,'SW-A1','s'],SA2:[470,370,'SW-A2','s'],
  PA1:[110,470,'PC-A1','p'],PA2:[230,470,'PC-A2','p'],PA3:[470,470,'PC-A3','p'],
  RT:[690,260,'R-TEMETO','r'],ST:[690,370,'SW-T1','s'],PT:[690,470,'PC-T1','p'],
  RK:[890,150,'R-KRIPTA','r'],SK:[890,260,'SW-K1','s'],PK:[890,370,'PC-K1','p']};
  const L=[['ISPF','R1','203.0.113.0/30'],['ISPT','R2','198.51.100.0/30 (tartalék)'],['R1','SD1',''],['R2','SD2',''],
  ['SD1','SD2','Po1 LACP',1],['SD1','SA1','Po2 PAgP',1],['SD2','SA2','Po3 PAgP',1],['SA1','PA1',''],['SA1','PA2',''],['SA2','PA3',''],
  ['R1','R2','L4'],['R1','RT','L1'],['R2','RK','L2'],['RT','RK','L3'],['RT','ST',''],['ST','PT',''],['RK','SK',''],['SK','PK','']];
  let s='<svg viewBox="0 0 1000 520" width="100%" style="min-width:680px">';
  L.forEach(([a,b,lb,th])=>{const A=n[a],B=n[b];s+=`<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="${th?'#ff7a1a':'#9b5cff'}" stroke-width="${th?5:2}" ${a.startsWith('ISP')?'stroke-dasharray="6 4"':''}/>`;
    if(lb) s+=`<text x="${(A[0]+B[0])/2+6}" y="${(A[1]+B[1])/2-4}" fill="#a899c4" font-size="12">${lb}</text>`});
  Object.values(n).forEach(([x,y,nm,k])=>{
    const sh=k=='r'?`<circle cx="${x}" cy="${y}" r="24" fill="#2b1d44" stroke="#ff7a1a" stroke-width="3"/>`:k=='s'?`<rect x="${x-26}" y="${y-15}" width="52" height="30" rx="5" fill="#2b1d44" stroke="#9b5cff" stroke-width="3"/>`:`<rect x="${x-22}" y="${y-13}" width="44" height="26" rx="8" fill="#1a1228" stroke="#5dff9d" stroke-width="2"/>`;
    s+=sh+`<text x="${x}" y="${y+4}" text-anchor="middle" fill="#fff" font-size="${k=='r'?10:11}">${k=='r'?'⬤':k=='s'?'▦':'🖥'}</text><text x="${x}" y="${y+(k=='r'?40:30)}" text-anchor="middle" fill="#efe6ff" font-size="13">${nm}</text>`});
  return s+'</svg>';
}



/* ===== Szerver-kommunikáció ===== */
let ST=null, off=0, refHtml=null, FLASH='';
const remaining=()=>ST.start+ST.durationMs-(ST.end||(Date.now()+off));
async function api(url,body){
  const o={credentials:'same-origin',headers:{}};
  if(body!==undefined){o.method='POST';o.headers['Content-Type']='application/json';o.body=JSON.stringify(body)}
  const r=await fetch(url,o); let j={}; try{j=await r.json()}catch(e){}
  if(!r.ok){const e=new Error(j.error||('Hiba ('+r.status+')'));e.status=r.status;e.data=j;throw e}
  return j;
}
async function boot(){try{ST=await api('/api/state')}catch(e){ST=null} apply()}
function apply(){if(ST)off=ST.now-Date.now();render()}

/* ===== Időzítő ===== */
setInterval(()=>{
  if(!ST||ST.user.role!=='student'||!ST.start) return;
  const r=remaining(),t=$('#timer'); if(t){t.textContent=fmt(r);t.classList.toggle('low',r<600000&&!ST.end)}
  if(!ST.end&&r<=0){
    if(!ST.expiredSeen){ST.expiredSeen=true;api('/api/ack-expired',{}).catch(()=>{});playScare(true)}
    else if($('#end').style.display!=='flex'&&$('#scare').style.display!=='flex') showEnd();
  }
},250);

/* ===== Nézetek ===== */
const hero=inner=>`<div class="hero"><span class="bat" style="top:30px">🦇</span><span class="bat" style="top:110px;animation-delay:-6s">🦇</span><span class="bat" style="top:200px;animation-delay:-10s">🦇</span>
<div class="moon"></div><h1>A Boszorkányhegyi<br>Hálózat átka</h1>
<div><span class="pump">🎃</span> <span class="pump" style="animation-delay:-1s">👻</span> <span class="pump" style="animation-delay:-2s">🎃</span></div>${inner}</div>`;
function setBar(timer){
  const b=$('#bar'); b.style.display='flex';
  b.innerHTML=`<div>${timer?'⏳ <span id="timer">--:--:--</span>':'🎃 Tanári felület'}</div><div id="who"><span>${esc(ST.user.name||ST.user.username)}${timer?' · '+(ST.end?'✅ Kész':'Feladat: '+Math.min(ST.solved+1,ST.total)+' / '+ST.total):''}</span><button class="sm" id="out">Kilépés</button></div>`;
  $('#out').onclick=async()=>{try{await api('/api/logout',{})}catch(e){} ST=null;refHtml=null;$('#end').style.display='none';render()};
}
function render(){
  if(!ST) return viewLogin();
  if(ST.user.role==='teacher') return viewTeacher();
  if(!ST.start) return viewIntro();
  viewStudent();
}
function viewLogin(){
  $('#bar').style.display='none';
  $('#app').innerHTML=hero(`<p>${STORY}</p><div class="ans" style="justify-content:center;flex-direction:column;align-items:center"><input type="text" id="lu" placeholder="Felhasználónév" autocomplete="username"><input type="password" id="lp" placeholder="Jelszó" autocomplete="current-password"><button class="big" id="lgo" style="font-size:1.3rem;padding:12px 30px">🕯️ Belépés</button></div><div class="msg" id="lmsg"></div>`);
  const go=async()=>{
    try{await api('/api/login',{username:$('#lu').value,password:$('#lp').value});await boot()}
    catch(e){$('#lmsg').textContent=e.message}
  };
  $('#lgo').onclick=go; $('#lp').onkeydown=e=>{if(e.key==='Enter')go()}; $('#lu').focus();
}
function viewIntro(){
  setBar(false); $('#bar').querySelector('div').textContent='🎃 '+(ST.user.name||ST.user.username);
  $('#app').innerHTML=hero(`<p>${STORY}</p><p>Időtök: <strong>${Math.round(ST.durationMs/60000)} perc</strong>. Minden feladat előtt egy logikai rejtvényt kell megfejtenetek, a végén pedig fel kell töltenetek a Packet Tracer munkafájlotokat. Vigyázzatok: a sötétben bármi előugorhat…</p><button class="big" id="go">🕯️ Kezdődjön az éjszaka</button>`);
  $('#go').onclick=async()=>{ST=await api('/api/start',{});apply();vid.load()};
}
function viewStudent(){
  setBar(true);
  if(refHtml===null) refHtml=ref();
  let h=refHtml;
  h+=`<div class="card"><h2>📦 Packet Tracer fájl feltöltése</h2><p class="pts">Tallózd ki a .pkt fájlodat, a feltöltés a szerver adatbázisába kerül. Többször is feltölthetsz, a legutóbbit értékeljük.</p>
  <div class="ans"><input type="file" id="pktfile" accept=".pkt,.pka"><button id="ubtn" disabled>Feltöltés</button></div>
  <progress id="uprog" max="100" value="0" style="width:100%;display:none"></progress><div class="msg" id="umsg"></div>
  ${ST.files.length?`<div class="tw"><table><tr><th>Fájl</th><th>Méret</th><th>Feltöltve</th><th></th></tr>${ST.files.map(f=>`<tr><td>${esc(f.filename)}</td><td>${mb(f.size)}</td><td>${dt(f.uploaded_at)}</td><td><a href="/api/files/${f.id}">letöltés</a></td></tr>`).join('')}</table></div>`:''}</div>`;
  for(let i=0;i<ST.total;i++){
    const k=ST.tasks[i], last=i===ST.total-1;
    if(k){
      h+=`<div class="card"><h2>${last?'🏁 ':(i+1)+'. feladat – '}${k.title}</h2><div class="pts">${k.pts}</div><ul>${k.items.map(x=>`<li>${x}</li>`).join('')}</ul>${k.ol.length?`<strong>${k.olt}:</strong><ol>${k.ol.map(x=>`<li>${x}</li>`).join('')}</ol>`:''}${k.note?`<p>${k.note}</p>`:''}</div>`;
    } else if(i===ST.solved&&ST.puzzle){
      h+=`<div class="card puz" id="puz"><h2>🔮 Rejtvény a(z) ${i+1}. ${last?'ellenőrzés':'feladat'} feloldásához</h2><p style="font-size:1.1rem">${esc(ST.puzzle.q)}</p>
      <div class="ans"><input type="text" id="ain" autocomplete="off" placeholder="A válaszod"><button id="abtn">Feloldás</button></div><div class="msg" id="amsg"></div></div>`;
    } else h+=`<div class="card locked"><h2>🔒 ${last?'Végső ellenőrzés':(i+1)+'. feladat'}</h2><div class="pts">Előbb oldd meg az előző rejtvényt</div></div>`;
  }
  if(ST.solved>=ST.total&&!ST.end) h+=`<div style="text-align:center"><button class="big" id="fin">✅ Befejeztük</button></div>`;
  if(ST.end) h+=`<div class="card"><h2 class="ok">Kész! Maradék idő: ${fmt(remaining())}</h2></div>`;
  $('#app').innerHTML=h;
  const b=$('#abtn'); if(b){b.onclick=check;$('#ain').onkeydown=e=>{if(e.key==='Enter')check()}}
  const f=$('#fin'); if(f) f.onclick=async()=>{ST=await api('/api/finish',{});apply()};
  setupUpload();
  if(FLASH){const m=$('#umsg');m.className='msg ok';m.textContent=FLASH;FLASH=''}
}
async function check(){
  const v=$('#ain').value; if(!v.trim()) return;
  $('#abtn').disabled=true;
  try{
    const r=await api('/api/puzzle',{answer:v});
    if(r.ok){ST=await api('/api/state');off=ST.now-Date.now(); if(r.scare) playScare(false,render); else render()}
    else wrong(r.wait||8);
  }catch(e){ if(e.status===429) wrong(e.data.wait||8); else {$('#amsg').textContent=e.message;$('#abtn').disabled=false} }
}
function wrong(c){
  const p=$('#puz'),m=$('#amsg'),b=$('#abtn'); p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
  b.disabled=true; m.textContent=`Hibás válasz! Újra próbálkozhatsz ${c} mp múlva.`;
  const iv=setInterval(()=>{c--;if(c<=0){clearInterval(iv);b.disabled=false;m.textContent=''}else m.textContent=`Hibás válasz! Újra próbálkozhatsz ${c} mp múlva.`},1000);
}
function setupUpload(){
  const f=$('#pktfile'),b=$('#ubtn'),m=$('#umsg'),p=$('#uprog'); if(!f) return;
  const okName=n=>/\.(pkt|pka)$/i.test(n);
  f.onchange=()=>{const x=f.files[0];m.className='msg';m.textContent=x&&!okName(x.name)?'Csak .pkt vagy .pka fájl tölthető fel.':'';b.disabled=!x||!okName(x.name)};
  b.onclick=()=>{
    const x=f.files[0]; if(!x) return; const fd=new FormData(); fd.append('file',x);
    const r=new XMLHttpRequest(); r.open('POST','/api/upload'); p.style.display='block'; b.disabled=true;
    r.upload.onprogress=e=>{if(e.lengthComputable)p.value=e.loaded/e.total*100};
    r.onload=async()=>{
      let j={};try{j=JSON.parse(r.responseText)}catch(e){}
      if(r.status===200){FLASH='✅ Sikeres feltöltés!';ST=await api('/api/state');apply()}
      else{m.className='msg';m.textContent=j.error||('Hiba ('+r.status+')');b.disabled=false;p.style.display='none'}
    };
    r.onerror=()=>{m.className='msg';m.textContent='Hálózati hiba.';b.disabled=false};
    r.send(fd);
  };
}

async function loadAdmin(){
  try{
    const d=await api('/api/admin/overview');
    $('#adm').innerHTML=d.users.length?`<div class="tw"><table><tr><th>Felhasználó</th><th>Név</th><th>Feladat</th><th>Kezdés</th><th>Hátralévő idő</th><th>Fájlok</th><th></th></tr>${d.users.map(u=>{
      const r=u.start?(u.end?'✅ kész':fmt(u.start+d.durationMs-d.now)):'–';
      return `<tr><td>${esc(u.username)}</td><td>${esc(u.name||'')}</td><td>${u.solved}/${d.total}</td><td>${dt(u.start)}</td><td>${r}</td><td>${u.files.map(f=>`<a href="/api/files/${f.id}" title="${dt(f.uploaded_at)} · ${mb(f.size)}">${esc(f.filename)}</a>`).join('<br>')||'–'}</td><td><button class="sm red" data-r="${u.id}">Reset</button></td></tr>`}).join('')}</table></div>`:'Még nincs diák. Hozz létre néhányat lent.';
    document.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{if(confirm('Biztosan nullázod a diák állását? (A feltöltött fájlok megmaradnak.)')){await api('/api/admin/reset',{id:+b.dataset.r});loadAdmin()}});
  }catch(e){$('#adm').textContent=e.message}
}
